<!--{"file": "faq.html", "nav": "faq", "title": "FAQ", "desc": "Answers about booking a private chef in Lagos, joining as a chef, payments and safety on Private Chef."}-->

<section class="phero phero--compact g-cocoa grain" data-ground="dark" aria-labelledby="faq-title">
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="wrap phero__center">
    <span class="eyebrow" data-reveal>Help centre</span>
    <h1 class="title" id="faq-title" data-split>Questions, <span class="grad-text">answered.</span></h1>
    <div class="faq-search" data-reveal>
      <label class="sr" for="faq-q">Search questions</label>
      <span class="pc-search faq-search__box">{{i:magnifying-glass}}<input id="faq-q" type="search" placeholder="Search, e.g. refund, verified, address" autocomplete="off"></span>
    </div>
  </div>
</section>

<section class="sec g-stone arc" aria-label="Questions">
  <div class="wrap wrap--narrow faq" data-faq>
    <div class="faq__chips" role="group" aria-label="Filter by topic" data-reveal>
      <button class="pc-chip is-on" type="button" aria-pressed="true" data-cat="all">All</button>
      <button class="pc-chip" type="button" aria-pressed="false" data-cat="Clients">{{i:users|pc-i--sm}}Clients</button>
      <button class="pc-chip" type="button" aria-pressed="false" data-cat="Chefs">{{i:chef-hat|pc-i--sm}}Chefs</button>
      <button class="pc-chip" type="button" aria-pressed="false" data-cat="Payments">{{i:wallet|pc-i--sm}}Payments</button>
      <button class="pc-chip" type="button" aria-pressed="false" data-cat="Safety">{{i:shield-check|pc-i--sm}}Safety</button>
    </div>
    <p class="faq__count" aria-live="polite"></p>
    <!--FAQ:all-->
    <div class="faq__empty" hidden>
      <span class="faq__emptyic">{{i:bowl-food|pc-i--lg}}</span>
      <h2 class="h3">Nothing on the menu for that.</h2>
      <p>Try another word, or ask us directly.</p>
    </div>
    <aside class="stuck g-cocoa grain" data-ground="dark" data-reveal>
      <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
      <div><h2 class="h3">Still stuck?</h2><p>A real person replies within 2 hours, Monday to Saturday, 8am to 8pm.</p></div>
      <a class="pc-btn pc-btn--primary pc-btn--lg js-magnet" href="contact.html">Contact us {{i:arrow-right}}</a>
    </aside>
  </div>
</section>
